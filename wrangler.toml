# The edge. Deploy from the repository root after `bun run build`:
#   bunx wrangler deploy
# Secrets (never in files):  bunx wrangler secret put ENGINE_TOKEN
name = "quantum-ready-labs"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ENGINE_URL = "https://qrl-engine.fly.dev"
PUBLIC_ORIGIN = "https://quantumreadylabs.com"
ALLOWED_PORTS = "443"

[[d1_databases]]
binding = "DB"
database_name = "qrl"
database_id = "ce9cc226-efee-486d-a451-19a9489d6d1d"

[observability]
enabled = true

# The public hostnames. Workers custom domains create the DNS records and certificates.
[[routes]]
pattern = "quantumreadylabs.com"
custom_domain = true

[[routes]]
pattern = "www.quantumreadylabs.com"
custom_domain = true
