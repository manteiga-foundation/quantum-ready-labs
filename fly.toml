# Fly Machines configuration for the engine. Deploy from the repository root:
#   fly deploy --config fly.toml
# Secrets (set once, never in files):  fly secrets set ENGINE_TOKEN=<random>
app = "qrl-engine"
primary_region = "iad"

[build]
  dockerfile = "engine/Dockerfile"

[env]
  PORT = "8787"
  # Scans in flight per machine before the engine answers 429. Sized with the proxy limits below:
  # the proxy spreads to the other machine (and wakes it) past soft_limit, well before this.
  ENGINE_MAX_CONCURRENT = "32"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays warm (no cold start for the first reader); the second wakes under load.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
